server {
    # only https, there is no plain http port
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/transcendence.crt;
    ssl_certificate_key /etc/nginx/ssl/transcendence.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # room for avatar uploads
    client_max_body_size 5m;

    # react app, unknown paths go to index.html so react router can handle them
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # api, admin panel and swagger docs go to django
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # django uses this one to know the request came over https
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static files of django (admin, swagger), the volume is shared with backend
    location /static/ {
        alias /var/www/static/;
    }

    # websockets, the Upgrade headers are needed to keep the connection open
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
